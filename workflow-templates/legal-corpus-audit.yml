name: legal-corpus-audit

# Selectable organization template for any canonical-cloud repository that
# carries a `docs/legal/` template tree governed by
# policies/LEGAL_DOCUMENT_GOVERNANCE.md in canonical-cloud/.github. It runs the
# hermetic Python audits the repository ships and, when the repository also
# carries TypeSpec + JSON Schema peer authorities under `contracts/`, the
# pinned tjsv parity gate over the instance corpus. Steps for scripts the
# repository does not have are skipped explicitly, never reported as passed.

on:
  pull_request:
    paths:
      - "docs/legal/**"
      - "data/**"
      - "contracts/**"
      - "generated/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/legal-corpus-audit.yml"
  push:
    branches:
      - $default-branch
  schedule:
    - cron: "27 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legal-corpus-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Reject unresolved conflict markers and whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          status=0
          git grep -n -I -E '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- . || status=$?
          test "$status" -eq 1
      - name: Legal corpus audit (leaks, claims, clauses, headers)
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/check_legal.py || { echo "::error::scripts/check_legal.py is required for a docs/legal tree"; exit 1; }
          python3 scripts/check_legal.py
      - name: Agreement catalog audit
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/check_legal_catalog.py ]; then python3 scripts/check_legal_catalog.py; else echo "::notice::no catalog checker in this repository (skipped)"; fi
      - name: Docs <-> data sync (data contract, rendered documents, extracted registry)
        shell: bash
        run: |
          set -euo pipefail
          ran=0
          if [ -f scripts/check_legal_data.py ]; then python3 scripts/check_legal_data.py; ran=1; fi
          if [ -f scripts/render_legal_data.py ]; then python3 scripts/render_legal_data.py --check; ran=1; fi
          if [ -f scripts/extract_legal_registry.py ]; then python3 scripts/extract_legal_registry.py --check; ran=1; fi
          [ "$ran" = 1 ] || echo "::notice::no legal data contracts in this repository (skipped)"
      - name: Tests for the legal checkers
        shell: bash
        run: |
          set -euo pipefail
          if ls tests/test_check_legal.py tests/test_legal_*.py >/dev/null 2>&1; then
            python3 -m unittest discover -s tests -p 'test_*legal*.py' -v
          else
            echo "::notice::no legal checker tests in this repository (skipped)"
          fi
      - name: Detect peer authorities
        id: contracts
        shell: bash
        run: |
          if [ -f contracts/main.tsp ] && [ -f contracts/authored.schema.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no contracts/main.tsp + contracts/authored.schema.json pair; parity gate skipped"
          fi
      - name: Set up the tested Node runtime
        if: steps.contracts.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
      - name: TypeSpec and JSON Schema peer-authority parity over the instance corpus
        if: steps.contracts.outputs.present == 'true'
        uses: ORESoftware/typespec-json-schema-validator@c745036456dd80408b83217118b8563edb8f6abd
        with:
          typespec: contracts/main.tsp
          schema: contracts/authored.schema.json
          instances: contracts/instances
          report: .typespec-json-schema-validator/report.json
          sarif: .typespec-json-schema-validator/report.sarif
          output_dir: .typespec-json-schema-validator/generated
          max_probes: "64"
      - name: Verify authored authorities were not modified
        if: steps.contracts.outputs.present == 'true'
        shell: bash
        run: git diff --exit-code -- contracts/ data/ generated/
      - name: Retain parity evidence
        if: ${{ always() && steps.contracts.outputs.present == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: legal-corpus-audit-${{ github.event.repository.name }}-${{ github.run_id }}
          path: .typespec-json-schema-validator/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
